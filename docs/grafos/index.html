    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      color: #1e293b;
      overflow: hidden;
      height: 100vh;
    }
    
    /* Header */
    #header {
      background: linear-gradient(135deg, #1e293b, #334155);
      color: white;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      position: relative;
      z-index: 100;
    }
    #header h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    #header h1 span {
      color: #60a5fa;
    }
    #header .subtitle {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 400;
    }
    
    /* Tab Navigation */
    #tabs {
      display: flex;
      gap: 4px;
      background: #1e293b;
      padding: 0 28px;
      border-bottom: 1px solid #334155;
      position: relative;
      z-index: 100;
    }
    .tab-btn {
      padding: 10px 18px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      color: #94a3b8;
      background: transparent;
      border: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: #e2e8f0; background: rgba(255,255,255,0.05); }
    .tab-btn.active {
      color: #60a5fa;
      border-bottom-color: #60a5fa;
      background: rgba(96, 165, 250, 0.08);
    }
    
    /* Graph Container */
    #graph-container {
      width: 100%;
      height: calc(100vh - 120px);
      position: relative;
    }
    #mynetwork {
      width: 100%;
      height: 100%;
    }
    
    /* Legend */
    #legend {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: white;
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      font-size: 11px;
      min-width: 140px;
      z-index: 10;
      border: 1px solid #e2e8f0;
    }
    #legend h3 {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 0;
    }
    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.1);
    }
    .legend-label {
      color: #475569;
      font-size: 11px;
    }
    
    /* Stats */
    #stats {
      position: absolute;
      top: 16px;
      left: 16px;
      background: white;
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      font-size: 12px;
      z-index: 10;
      border: 1px solid #e2e8f0;
      display: flex;
      gap: 20px;
    }
    .stat-item {
      text-align: center;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
    }
    .stat-label {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    
    /* Controls */
    .controls {
      display: flex;
      gap: 6px;
    }
    .control-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.15s;
    }
    .control-btn:hover {
      background: rgba(255,255,255,0.18);
    }
    
    /* Info Tooltip */
    #info-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: white;
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      font-size: 12px;
      z-index: 10;
      border: 1px solid #e2e8f0;
      max-width: 320px;
      display: none;
      line-height: 1.5;
    }
    #info-panel h4 {
      font-size: 13px;
      margin-bottom: 4px;
      color: #1e293b;
    }
    #info-panel .info-path {
      color: #64748b;
      font-family: monospace;
      font-size: 11px;
      margin-bottom: 6px;
    }
    #info-panel .info-deps {

    }
    #info-panel .close-info {
      position: absolute;
      top: 8px;
      right: 10px;
      cursor: pointer;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>

    let network = null;
    let currentTab = 'deps';
    
    const categoryColors = {
      'app': { background: '#FFE0B2', border: '#FF9800', shape: 'box' },
      'components': { background: '#C8E6C9', border: '#4CAF50', shape: 'ellipse' },
      'lib': { background: '#BBDEFB', border: '#2196F3', shape: 'diamond' },
      'store': { background: '#E1BEE7', border: '#9C27B0', shape: 'star' },
      'hooks': { background: '#F8BBD0', border: '#E91E63', shape: 'triangle' },
      'types': { background: '#B2DFDB', border: '#009688', shape: 'square' }
    };
    
    function buildDependencyNetwork() {
      const nodes = new vis.DataSet(DATA.nodes.map(n => ({
        ...n,
        shape: categoryColors[n.group]?.shape || 'dot',
        color: {
          background: categoryColors[n.group]?.background || '#F5F5F5',
          border: categoryColors[n.group]?.border || '#9E9E9E'
        }
      })));
      
      const edges = new vis.DataSet(DATA.edges);
      
      const options = {
        physics: {
          stabilization: { iterations: 100 },
          solver: 'forceAtlas2Based',
          forceAtlas2Based: {
            gravitationalConstant: -40,
            centralGravity: 0.005,
            springLength: 180,
            springConstant: 0.02,
            damping: 0.4
          }
        },
        layout: { improvedLayout: true },
        edges: {
          smooth: { type: 'curvedCW', roundness: 0.15 },
          arrows: { to: { enabled: true, scaleFactor: 0.6 } }
        },
        interaction: {
          hover: true,
          tooltipDelay: 200,
          navigationButtons: true,
          keyboard: true
        },
        nodes: {
          font: { size: 11, face: 'Inter, Arial' },
          borderWidth: 1.5,
          borderWidthSelected: 3,
          shadow: { enabled: true, size: 3 }
        }
      };
      
      return { nodes, edges, options };
    }
    
    function buildRouteNetwork() {
      const routeNodes = DATA.routeData.map(r => ({
        id: r.id,
        label: r.label,
        shape: 'box',
        color: {
          background: r.id.includes(':') ? '#FCE4EC' : '#E8F5E9',
          border: r.id.includes(':') ? '#E91E63' : '#4CAF50'
        },
        font: { size: 12 }
      }));
      
      // Route edges
      const routeEdges = [];
      for (const r of DATA.routeData) {
        const parts = r.id.split('/');
        if (parts.length > 1) {
          const parent = parts.slice(0, -1).join('/');
          routeEdges.push({
            from: parent,
            to: r.id,
            arrows: 'to',
            color: { color: '#90A4AE' },
            width: 1.5
          });
        }
      }
      
      // Add root
      routeNodes.unshift({
        id: '',
        label: '🏠 / (Landing)',
        shape: 'box',
        color: { background: '#FFF3E0', border: '#FF9800' },
        font: { size: 14, face: 'Inter, Arial' }
      });
      
      // Connect root to first-level routes
      for (const r of DATA.routeData) {
        if (!r.id.includes('/')) {
          routeEdges.push({
            from: '',
            to: r.id,
            arrows: 'to',
            color: { color: '#FF9800' },
            width: 2
          });
        }
      }
      
      const nodes = new vis.DataSet(routeNodes);
      const edges = new vis.DataSet(routeEdges);
      
      const options = {
        physics: {
          solver: 'hierarchicalRepulsion',
          hierarchicalRepulsion: { nodeDistance: 120 }
        },
        layout: {
          hierarchical: {
            enabled: true,
            direction: 'UD',
            sortMethod: 'directed',
            levelSeparation: 60,
            nodeSpacing: 120
          }
        },
        edges: {
          smooth: true,
          arrows: { to: { enabled: true, scaleFactor: 0.8 } }
        },
        interaction: {
          hover: true,
          navigationButtons: true,
          keyboard: true
        },
        nodes: {
          font: { size: 12, face: 'Inter, Arial' },
          borderWidth: 2,
          shadow: { enabled: true }
        }
      };
      
      return { nodes, edges, options };
    }
    
    function buildUINetwork() {
      // Find pages and UI components
      const uiNodes = [];
      const uiEdges = [];
      
      // UI components
      const uiComponents = {};
      const pages = [];
      
      DATA.nodes.forEach(n => {
        if (n.id.includes('components/ui/')) {
          const name = n.id.split('/').pop();
          uiComponents[n.id] = true;
          uiNodes.push({
            id: n.id,
            label: name,
            shape: 'ellipse',
            color: { background: '#FFF8E1', border: '#F9A825' },
            font: { size: 10 },
            group: 'ui'
          });
        } else if (n.id.includes('/page.')) {
          const route = n.id.replace(/^app//, '').replace(//page.(tsx|ts)$/, '') || '/';
          pages.push(n.id);
          uiNodes.push({
            id: n.id,
            label: route,
            shape: 'box',
            color: { background: '#E8F5E9', border: '#4CAF50' },
            font: { size: 11 },
            group: 'page'
          });
        }
      });
      
      // Connect pages to UI components they use
      DATA.edges.forEach(e => {
        if (pages.includes(e.from) && DATA.nodes.some(n => n.id === e.to && n.id.includes('components/ui/'))) {
          uiEdges.push({
            from: e.from,
            to: e.to,
            arrows: 'to',
            color: { color: '#F9A825', opacity: 0.5 },
            width: 1,
            style: 'dashed'
          });
        }
      });
      
      const nodes = new vis.DataSet(uiNodes);
      const edges = new vis.DataSet(uiEdges);
      
      const options = {
        physics: {
          solver: 'forceAtlas2Based',
          forceAtlas2Based: {
            gravitationalConstant: -50,
            springLength: 150,
            springConstant: 0.03
          }
        },
        edges: {
          smooth: { type: 'curvedCW' },
          arrows: { to: { enabled: true, scaleFactor: 0.6 } }
        },
        interaction: {
          hover: true,
          navigationButtons: true,
          keyboard: true
        },
        nodes: {
          font: { size: 11, face: 'Inter, Arial' },
          borderWidth: 1.5,
          shadow: { enabled: true }
        }
      };
      
      return { nodes, edges, options };
    }
    
    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = tab;
      
      let data;
      if (tab === 'deps') data = buildDependencyNetwork();
      else if (tab === 'routes') data = buildRouteNetwork();
      else data = buildUINetwork();
      
      network.setData(data);
      network.setOptions(data.options);
      network.fit({ animation: true });
    }
    
    function resetView() {
      network.fit({ animation: true });
    }
    
    function fitView() {
      network.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
    }
    
    function closeInfo() {
      document.getElementById('info-panel').style.display = 'none';
    }
    
    // Initialize
    const container = document.getElementById('mynetwork');
    const initialData = buildDependencyNetwork();
    
    network = new vis.Network(container, initialData, initialData.options);
    
    network.on('click', function(params) {
      if (params.nodes.length > 0) {
        const nodeId = params.nodes[0];
        const node = DATA.nodes.find(n => n.id === nodeId);
        if (node) {
          document.getElementById('info-title').textContent = node.label;
          document.getElementById('info-path').textContent = nodeId;
          
          // Find dependencies
          const deps = DATA.edges.filter(e => e.from === nodeId).map(e => {
            const target = DATA.nodes.find(n => n.id === e.to);
            return target ? target.label : e.to;
          }).join(', ');
          document.getElementById('info-deps').textContent = deps ? '→ ' + deps : 'Sin dependencias directas';
          document.getElementById('info-panel').style.display = 'block';
        }
      }
    });
    
    network.on('doubleClick', function() {
      closeInfo();
    });
    
    window.addEventListener('resize', () => {
      network.fit({ animation: false });
    });
  </script>
